<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="nzs-skills — nothing is done until it is checked where done is actually true.">
  <title>nzs-skills</title>

  <!--
    The hero carries the name and the promise. The flow diagram is a separate
    figure (flow.svg) further down the page — a hero that explains the mechanism
    before the reader knows what the thing is called has the order backwards.

    Authored rather than generated: a wordmark has to be typographically exact,
    and image models cannot set type.
  -->

  <defs>
    <style>
      .paper { fill: #f2ece1; }
      .ink   { fill: #1c1a17; }
      .red   { fill: #d63c1e; }
      .hair  { stroke: #1c1a17; stroke-width: 1; opacity: .26; fill: none; }
      .redln { stroke: #d63c1e; stroke-width: 4; fill: none; }
      .t     { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .word  { font-size: 132px; font-weight: 700; letter-spacing: -.035em; fill: #1c1a17; }
      .tag   { font-size: 34px; fill: #1c1a17; opacity: .82; }
      .meta  { font-size: 21px; fill: #1c1a17; opacity: .55; letter-spacing: .04em; }
      .strike{ font-size: 34px; fill: #1c1a17; opacity: .38; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #14120f; }
        .word, .tag, .meta, .strike { fill: #ece5d8; }
        .hair  { stroke: #ece5d8; opacity: .2; }
      }
    </style>
  </defs>

  <rect class="paper" width="1600" height="620"/>

  <!-- registration marks + the measure along the foot: the house material -->
  <g class="hair">
    <path d="M44 44h26M57 31v26"/><path d="M1556 44h-26M1543 31v26"/>
    <path d="M44 576h26M57 563v26"/><path d="M1556 576h-26M1543 563v26"/>
    <path d="M96 540h1408"/>
    <path d="M96 540v-13M167 540v-9M238 540v-9M309 540v-9M380 540v-9M451 540v-13M522 540v-9M593 540v-9M664 540v-9M735 540v-9M806 540v-13M877 540v-9M948 540v-9M1019 540v-9M1090 540v-9M1161 540v-13M1232 540v-9M1303 540v-9M1374 540v-9M1445 540v-9M1504 540v-13"/>
  </g>

  <!-- wordmark -->
  <text class="t word" x="94" y="242">nzs-skills</text>

  <!-- the red rule: the through-line of the whole visual language -->
  <path class="redln" d="M96 286h1408"/>

  <!-- the promise, stated as the correction it performs -->
  <text class="t strike" x="96" y="358">“fixed!”</text>
  <line x1="96" y1="347" x2="272" y2="347" stroke="#d63c1e" stroke-width="3"/>
  <text class="t tag" x="300" y="358">→  measured 1.97:1 against 3:1 required.  not fixed.</text>

  <text class="t tag" x="96" y="424">nothing is done until it is checked</text>
  <text class="t tag" x="96" y="468">where <tspan font-weight="700">“done”</tspan> is actually true.</text>

  <!-- the tick, small, sitting on the measure -->
  <g transform="translate(1332 372)">
    <path d="M8 46 l30 32 l68 -76" stroke="#d63c1e" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 108h112M4 100v16M116 100v16" stroke="#1c1a17" stroke-width="2.4" fill="none" opacity=".8"/>
  </g>

  <text class="t meta" x="96" y="592">executable skills for Claude Code   ·   extracted from 279 commits of real work</text>
</svg>
